# ═══════════════════════════════════════════════════════════════════════
# SORBA Cloud — EmberNET Bridge Chart Values
# ═══════════════════════════════════════════════════════════════════════
# This chart deploys the EmberNET bridge layer for SORBA Cloud.
# It does NOT deploy the actual SORBA Cloud platform — that's done
# separately via:
#
#   helm -n $TENANT upgrade $TENANT \
#     oci://sorbaregistry.azurecr.io/helm/sorba-cloud --version=1.5.0 \
#     -i --create-namespace -f values-sorba.yaml
#
# THIS chart adds a labeled pod + service for EmberNET dashboard
# discovery and iframe proxy integration.
# ═══════════════════════════════════════════════════════════════════════

# The bridge container pulls `nginx:alpine` from Docker Hub. Authenticated
# pulls bypass the 100/6h anonymous rate limit. `dockerhub-pull-secret` is
# pre-created in fireball-system and replicated to every namespace by
# kubernetes-replicator (Lucas handoff, 2026-04-30).
imagePullSecrets:
  - name: dockerhub-pull-secret

# ── Service Configuration (EmberNET proxy target) ────────────────────
service:
  type: ClusterIP
  port: 443

nodeSelector: {}
tolerations: []
affinity: {}

# ── EmberNET dashboard-injected values ───────────────────────────────
# The dashboard injects `embernet.displayName` (the release name) and
# `tenantLabels` (embernet.ai/tenant, deployed-by, deployment-id) at deploy
# time. Both default empty for a bare `helm install`; the chart renders them
# onto the pod template and Service. Do NOT remove — tenantLabels is the single
# most common silent App Store failure when absent.
embernet: {}
tenantLabels: {}

# ── GUI Configuration (EmberNET Store Labels) ────────────────────────
gui:
  enabled: true
  port: 443
  type: "web"
  displayName: "SORBA Cloud — IoT Unified Platform"

# ── SORBA Platform Connection ─────────────────────────────────────────
# These configure the bridge to proxy traffic to the upstream SORBA
# Cloud platform services deployed in the same namespace.
sorba:
  # Domain and tenant must match the upstream SORBA deployment
  domain: ""              # e.g., "example.com"
  tenant: ""              # e.g., "sorba-demo"
  # Internal service name of the upstream SORBA platform entry point.
  # The bridge's nginx config proxies to this service.
  # Adjust if the upstream release creates a differently-named service.
  platformService: "platform"
  platformPort: 443

# ── Security Context ──────────────────────────────────────────────────
# Applied to the bridge container in deployment.yaml. Runs the nginx proxy as
# the unprivileged `nobody` uid with no privilege escalation and no added
# capabilities.
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ═══════════════════════════════════════════════════════════════════════
# REFERENCE: Upstream SORBA Cloud values.yaml
# ═══════════════════════════════════════════════════════════════════════
# Create a SEPARATE values-sorba.yaml for the upstream deployment:
#
# global:
#   domain: "<your_domain.com>"
#   tenant: "<your_tenant>"          # platform.{tenant}.{domain} — coordinate with Sorba
#   version: "1.5.0"
#   imagePullSecrets:
#     - name: acr-fireball-embernet  # cluster-wide, replicated by kubernetes-replicator
#   credentials:
#     enabled: false                 # using pre-created secret above instead
#     registry: fireball-embernet.azurecr.io
#   acmedns:
#     enabled: true
#   secrets:
#     mysql:
#       MYSQL_PASSWORD: "<secure>"
#     influx:
#       INFLUX_PASSWORD: "<secure>"
#     grafana:
#       GRAFANA_PASSWORD: "<secure>"
#     mqtt:
#       MQTT_PASSWORD: "<secure>"
#
# Deploy with:
#   helm registry login sorbaregistry.azurecr.io -u <USERNAME> -p <TOKEN>
#   export TENANT=<your_tenant>
#   helm -n $TENANT upgrade $TENANT \
#     oci://sorbaregistry.azurecr.io/helm/sorba-cloud --version=1.5.0 \
#     -i --create-namespace -f values-sorba.yaml
# ═══════════════════════════════════════════════════════════════════════
