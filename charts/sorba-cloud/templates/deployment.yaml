# ═══════════════════════════════════════════════════════════════════════
# SORBA Cloud — EmberNET Label Bridge Deployment
# ═══════════════════════════════════════════════════════════════════════
# This is NOT the main SORBA Cloud deployment. The upstream SORBA Cloud
# platform is deployed separately from its OCI registry
# (oci://sorbaregistry.azurecr.io/helm/sorba-cloud) — it is NOT a subchart
# dependency of this chart (Chart.yaml declares no dependencies).
#
# This deployment exists ONLY to provide EmberNET App Store labels so
# the dashboard can discover the SORBA Cloud deployment and enable the
# "Open" iframe button. It runs an nginx reverse proxy that:
#   1. Carries the embernet.ai/* discovery labels (see _helpers.tpl)
#   2. Provides a health endpoint for the dashboard proxy
#   3. Forwards to the actual SORBA platform service
#
# The upstream SORBA chart deploys MySQL, InfluxDB, Redis, Grafana,
# MQTT, NodeRed, AI Trainer, Identity, VPN, API Gateway, etc.
# This pod just makes all of that visible to EmberNET.
#
# NOT a sidecar: this is a standalone pod that proxies to the upstream
# SORBA platform Service via FQDN. The `sidecar-proxy` repo is a
# different pattern — an in-pod nginx that rewrites SPA URLs for apps
# served via query-param dashboard proxy. Sorba has its own ingress at
# platform.{tenant}.{domain}, so URL rewriting is not needed here.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sorba-cloud.fullname" . }}-bridge
  labels:
    {{- include "sorba-cloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sorba-cloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sorba-cloud.selectorLabels" . | nindent 8 }}
        # ═══════════════════════════════════════════════════════════
        # EmberNET Store discovery labels (per APP_STORE_DEPLOYMENT_FLOW.md
        # and AUDIT_HELM_CHARTS.md). These are how the dashboard discovers
        # the SORBA Cloud deployment and enables the "Open" iframe button.
        # ═══════════════════════════════════════════════════════════
        {{- include "sorba-cloud.storeLabels" . | nindent 8 }}
        # Tenant identity injected by the dashboard (store.go tenantLabels).
        # Without it the pod shell 403s and tenant views can't resolve it. Spec §2.
        {{- include "sorba-cloud.tenantLabels" . | nindent 8 }}
      annotations:
        # Prefer the dashboard-injected display name (.Values.embernet.displayName),
        # fall back to the chart-author override, then a sane default. Spec §2.
        embernet.ai/display-name: {{ .Values.embernet.displayName | default .Values.gui.displayName | default "SORBA Cloud" | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Lightweight nginx reverse proxy that forwards traffic to the
        # upstream SORBA platform service. This is what the EmberNET
        # dashboard iframe connects to.
        - name: bridge
          image: "nginx:alpine"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            # stock nginx:alpine runs as root; here it runs as uid 65534, which
            # can't write nginx's default /var/cache/nginx or /var/run — give it
            # writable emptyDirs so it starts non-root.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "sorba-cloud.fullname" . }}-bridge-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
