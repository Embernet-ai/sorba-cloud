# ═══════════════════════════════════════════════════════════════════════
# SORBA Cloud — EmberNET Bridge Service
# ═══════════════════════════════════════════════════════════════════════
# This service is what the EmberNET dashboard proxy targets for iframe
# embedding. It routes to the bridge pod, which forwards to the
# upstream SORBA Cloud platform.
#
# CRITICAL: The Service MUST carry embernet.ai/store-app and the
# other store labels for the Running Apps panel.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sorba-cloud.labels" . | nindent 4 }}
    # ═══════════════════════════════════════════════════════════════
    # EmberNET Store Labels on the SERVICE
    # Required for /api/apps/services (Running Apps panel)
    # ═══════════════════════════════════════════════════════════════
    {{- include "sorba-cloud.storeLabels" . | nindent 4 }}
    # Tenant identity injected by the dashboard (store.go tenantLabels). Without it
    # the Service is filtered out of every tenant view (services.go:226). Spec §2/§7.
    {{- include "sorba-cloud.tenantLabels" . | nindent 4 }}
  annotations:
    # Prefer the dashboard-injected display name, then chart override, then default.
    embernet.ai/display-name: {{ .Values.embernet.displayName | default .Values.gui.displayName | default "SORBA Cloud" | quote }}
    # Flux/Ziti mesh exposure so a remote-site (Fragua/Trane edge) dashboard can dial
    # the GUI and the reconciler derives tenant from the node label. Spec §7.
    flux.embernet.ai/expose: "true"
    {{- if .Chart.Icon }}
    embernet.ai/app-icon: {{ .Chart.Icon | quote }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "sorba-cloud.selectorLabels" . | nindent 4 }}
